add_parcel:
  name: Add parcel
  description: Add a parcel to the next available slot.
  fields:
    tracking_number:
      name: Tracking number
      description: The tracking number of the parcel.
      required: true
      example: "JD014600004860246190"
      selector:
        text:
    carrier:
      name: Carrier
      description: The carrier. Leave empty for automatic detection.
      required: false
      default: auto
      example: auto
      selector:
        select:
          options:
            - value: auto
              label: Auto-detect
            - value: bpost
              label: bPost
            - value: dhl
              label: "DHL (International)"
            - value: dhl_de
              label: DHL Germany
            - value: dpd
              label: DPD
            - value: fourpx
              label: 4PX / China Post
            - value: tnt
              label: TNT / FedEx
            - value: ups
              label: UPS
            - value: postnl
              label: PostNL
            - value: colisprive
              label: "Colis Privé (experimental)"
    friendly_name:
      name: Name
      description: Optional display name for the parcel.
      required: false
      example: "Amazon order"
      selector:
        text:

remove_parcel:
  name: Remove parcel
  description: Remove a parcel by its tracking number.
  fields:
    tracking_number:
      name: Tracking number
      description: The tracking number of the parcel to remove.
      required: true
      example: "JD014600004860246190"
      selector:
        text:
