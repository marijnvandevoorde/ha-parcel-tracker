<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2B4C86"/>
      <stop offset="1" stop-color="#141E38"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFE7BC"/>
      <stop offset="1" stop-color="#FFCE8A"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5B96A"/>
      <stop offset="1" stop-color="#E8A24E"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D48F3E"/>
      <stop offset="1" stop-color="#B9752C"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- tracking route, passes behind the parcel -->
  <path d="M 86 344 C 96 196 246 118 424 168"
        fill="none" stroke="#5FE3B8" stroke-width="20" stroke-linecap="round"
        stroke-dasharray="4 46"/>

  <!-- parcel -->
  <g>
    <path d="M 146 236 L 256 296 L 256 418 L 146 354 Z" fill="url(#leftFace)"/>
    <path d="M 366 236 L 256 296 L 256 418 L 366 354 Z" fill="url(#rightFace)"/>
    <path d="M 256 176 L 366 236 L 256 296 L 146 236 Z" fill="url(#topFace)"/>
    <!-- tape: across the top face and down the front-left face -->
    <g fill="#FFFFFF" opacity="0.34">
      <path d="M 176 252.4 L 226 279.6 L 336 219.6 L 286 192.4 Z"/>
      <path d="M 176 252.4 L 226 279.6 L 226 397.6 L 176 370.4 Z"/>
    </g>
  </g>

  <!-- destination -->
  <g transform="translate(400 148)">
    <circle r="42" fill="#5FE3B8"/>
    <circle r="15" fill="#14213D"/>
  </g>
</svg>
