name: Validate

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate HACS
        uses: hacs/action@main
        with:
          category: integration
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
